<div class="workspace-layout">
  <div class="left-sidebar">
    <mat-tab-group mat-align-tabs="start" class="data-analytics-container">
      <mat-tab label="Data">
        <mat-card class="table-name-card">
          Table Name
        </mat-card>
        <mat-card class="table-data-card">
          <div
            class="field-list"
            cdkDropList
            id="fieldsList"
            [cdkDropListData]="fields"
            [cdkDropListConnectedTo]="['columnsList','rowsList']"
            (cdkDropListDropped)="drop($event)"
          >
            <div
              class="field-item"
              *ngFor="let field of fields"
              cdkDrag
            >
              <mat-icon>drag_indicator</mat-icon>
              {{ field }}
            </div>
          </div>
        </mat-card>
      </mat-tab>
      <mat-tab label="Analytics">
        <mat-accordion class="tableau-accordion" multi>
          <mat-expansion-panel expanded>
            <mat-expansion-panel-header>
              <mat-panel-title>Pages</mat-panel-title>
            </mat-expansion-panel-header>
            <p class="placeholder">Pages content</p>
          </mat-expansion-panel>
          <mat-expansion-panel expanded>
            <mat-expansion-panel-header>
              <mat-panel-title>Filters</mat-panel-title>
            </mat-expansion-panel-header>
            <p class="placeholder">Filters content</p>
          </mat-expansion-panel>
          <mat-expansion-panel expanded>
            <mat-expansion-panel-header>
              <mat-panel-title>Marks</mat-panel-title>
            </mat-expansion-panel-header>
            <div class="marks-container">
              <mat-form-field appearance="outline" class="marks-select">
                <mat-select value="Automatic">
                  <mat-option value="Automatic">Automatic</mat-option>
                  <mat-option value="Bar">Bar</mat-option>
                  <mat-option value="Line">Line</mat-option>
                  <mat-option value="Area">Area</mat-option>
                </mat-select>
              </mat-form-field>
              <div class="marks-grid">
                <button mat-stroked-button class="marks-btn">
                  <mat-icon>palette</mat-icon> Color
                </button>
                <button mat-stroked-button class="marks-btn">
                  <mat-icon>scale</mat-icon> Size
                </button>
                <button mat-stroked-button class="marks-btn">
                  <mat-icon>text_fields</mat-icon> Text
                </button>
                <button mat-stroked-button class="marks-btn">
                  <mat-icon>details</mat-icon> Detail
                </button>
                <button mat-stroked-button class="marks-btn full">
                  <mat-icon>info</mat-icon> Tooltip
                </button>
              </div>
            </div>
          </mat-expansion-panel>
        </mat-accordion>
      </mat-tab>
    </mat-tab-group>
  </div>

  <div class="right-content">
    <div class="worksheet-toolbar">
      <div class="shelf">
        <span class="shelf-label">
          <mat-icon>view_column</mat-icon> Columns
        </span>
        <div
          class="input-dropzone"
          cdkDropList
          id="columnsList"
          [cdkDropListData]="columns"
          [cdkDropListConnectedTo]="['rowsList','fieldsList']"
          (cdkDropListDropped)="drop($event)"
        >
          <span
            class="pill blue"
            *ngFor="let col of columns; let i = index"
            cdkDrag
          >
            {{ col }}
            <span class="close" (click)="remove(columns,i)">×</span>
          </span>
        </div>
      </div>
      <div class="shelf">
        <span class="shelf-label">
          <mat-icon>view_stream</mat-icon> Rows
        </span>
        <div
          class="input-dropzone"
          cdkDropList
          id="rowsList"
          [cdkDropListData]="rows"
          [cdkDropListConnectedTo]="['columnsList','fieldsList']"
          (cdkDropListDropped)="drop($event)"
        >
          <span
            class="pill blue"
            *ngFor="let row of rows; let i = index"
            cdkDrag
          >
            {{ row }}
            <span class="close" (click)="remove(rows,i)">×</span>
          </span>
        </div>
      </div>
    </div>
    <div class="worksheet-canvas">
      <div *ngIf="!columns.length && !rows.length">
        Drop fields to build the view
      </div>
      <div *ngIf="columns.length || rows.length">
        <strong>Columns:</strong> {{ columns.join(', ') }}<br>
        <strong>Rows:</strong> {{ rows.join(', ') }}
      </div>
    </div>
  </div>
</div>
